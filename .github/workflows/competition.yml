name: Official competition
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r competition/requirements.txt pytest
      - run: python -m pytest -q tests/test_competition.py
      - run: docker build -f competition/Dockerfile -t rq2026-official .
      - name: Score the published example without networking
        run: |
          mkdir -p results
          chmod 777 results
          docker run --rm --network none --memory 2g --cpus 1 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m -v "$PWD/results:/results" rq2026-official --submission /app/competition/examples/baseline.zip --output /results/result.json
          python -c "import json; r=json.load(open('results/result.json')); assert len(r['episodes'])==20; assert all(x['reason'] not in ['model_error','physics_error'] for x in r['episodes']); assert 0 < r['mean_survival_seconds'] <= 60"
